org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The release tasks run apksigner, aapt2 and build.sh, which the configuration
# cache cannot snapshot; shieldy/ keeps it on when built on its own.
org.gradle.configuration-cache=false

# The certificate every released Shieldy APK must carry (SHA-256), and the
# repository whose releases hold the previous APK for the versionCode check.
shieldy.signingCertSha256=4726c7944aaee4206a5f40c7b5fa3b45d3518e8458fb377fd2a4e1e05151f7cf
shieldy.releaseRepo=skofqq/DNSCrypt-Android-Magisk
