# Один workflow на модуль и приложение.
# module  - shellcheck, сборка zip для arm64-v8a и armeabi-v7a, проверка содержимого.
# shieldy - тесты, lint и release APK из shieldy/.
# На тег вида 2.5 создаётся черновик релиза «Shieldy <версия>», к нему прикладываются
# Shieldy-Magisk-<версия>.zip и Shieldy-<версия>.apk. Черновик публикуется вручную. APK для релиза обязан быть подписан ключом из secrets
# репозитория, неподписанный в релиз не попадает.
name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck -S warning customize.sh post-fs-data.sh service.sh uninstall.sh scripts/*.sh tools/dnscrypt-ctl
          shellcheck -s bash -S warning build.sh

      - name: Версия в module.prop совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version=//p' module.prop)
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "module.prop: $v, тег: ${GITHUB_REF_NAME}"; exit 1; }

      - name: Сборка zip
        run: |
          bash build.sh
          # в репозитории лежит старый zip 2.1.18-r1, поэтому имя берём по версии
          echo "ZIP=Shieldy-Magisk-$(sed -n 's/^version=//p' module.prop).zip" >> "$GITHUB_ENV"

      - name: Проверка содержимого
        run: |
          zip="$ZIP"
          for a in arm arm64; do
            unzip -l "$zip" | grep -q "binary/dnscrypt-proxy-$a$" || { echo "нет бинарника $a"; exit 1; }
          done
          for a in i386 x86_64; do
            ! unzip -l "$zip" | grep -q "binary/dnscrypt-proxy-$a$" || { echo "лишний бинарник $a"; exit 1; }
          done
          unzip -l "$zip" | grep -q 'META-INF/com/google/android/update-binary'
          ! unzip -l "$zip" | grep -q ' shieldy/' || { echo "в zip попало приложение shieldy/"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ env.ZIP }}
          if-no-files-found: error

  shieldy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shieldy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи из secrets. Без них APK собирается неподписанным: для
      # проверки PR и форков этого хватает, для релиза - нет (см. ниже).
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "::error::Нет secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD: неподписанный APK в релиз не выкладывается"
              exit 1
            fi
            echo "secrets подписи нет, APK будет неподписанным"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      # Baseline profile лежит в app/src/release/generated; для его генерации нужно
      # устройство с root, поэтому CI только упаковывает готовый.
      - name: Release APK
        run: ./gradlew :app:assembleRelease -Pandroid.baselineProfile.automaticGenerationDuringBuild=false

      # Та же проверка, что в ./gradlew release: подпись релизным ключом и ни одной
      # x86-библиотеки. versionCode здесь не сравнивается - релиз модуля без новой
      # версии приложения прикладывает тот же APK.
      - name: Проверка APK для релиза
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: ./gradlew checkShieldyApk -Pshieldy.skipVersionCheck=true

      - name: Имя APK
        run: |
          dir=app/build/outputs/apk/release
          file=$(jq -r '.elements[0].outputFile' "$dir/output-metadata.json")
          name=$(jq -r '.elements[0].versionName' "$dir/output-metadata.json")
          case "$file" in *unsigned*) name="$name-unsigned" ;; esac
          mkdir -p ../out
          cp "$dir/$file" "../out/Shieldy-$name.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shieldy-apk
          path: out/Shieldy-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shieldy-reports
          path: |
            shieldy/app/build/reports/tests/
            shieldy/app/build/reports/lint-results-release.html

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [module, shieldy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if ls dist/*-unsigned.apk >/dev/null 2>&1; then echo "неподписанный APK"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Shieldy $GITHUB_REF_NAME" --notes "См. CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/Shieldy-*.apk --clobber
